[package]
name = "json-forge"
version = "0.2.0"
edition = "2021"
description = "Desktop viewer and editor for JSON"
license = "MIT"
repository = "https://github.com/5bitcube/json-forge"
authors = ["5bitcube"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
egui_json_tree = "0.17"
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
rfd = "0.15"
arboard = "3"
regex = "1"
interprocess = "2"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[workspace]
members = ["spellchecker"]
default-members = [".", "spellchecker"]
